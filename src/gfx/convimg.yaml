palettes:
  - name: global_palette
    fixed-entries:
      - color: {index: 0, r: 3, g: 102, b: 21} # background
      - color: {index: 1, r: 255, g: 0, b: 255} # transparent
      - color: {index: 2, r: 0, g: 8, b: 58} # spade color
      - color: {index: 3, r: 255, g: 0, b: 0} # heart color
      - color: {index: 4, r: 255, g: 65, b: 0} # diomond color
      - color: {index: 5, r: 0, g: 53, b: 16} # club color
      - color: {index: 6, r: 0, g: 255, b: 16} # valid selection
      - color: {index: 7, r: 240, g: 240, b: 240} # unknown selection
      - color: {index: 8, r: 255, g: 69, b: 16} # invalid selection
      - color: {index: 9, r: 255, g: 255, b: 255} # all white
      - color: {index: 10, r: 7, g: 131, b: 31} # alt green
    images: automatic

converts:
  - name: sprites
    palette: global_palette
    transparent-color-index: 0
    images:
      - blank_cardv2.png
      - bard_backv2.png
      - king.png
      - queen.png
      - jack.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites